services:
  - type: web
    name: terra-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: TERRA_MODE
        value: replay
      - key: TERRA_SCHEDULER_ENABLED
        value: "false"
      - key: TERRA_CORS_ORIGINS
        sync: false
      - key: TERRA_DB_URL
        sync: false
