services:
  - type: web
    name: terra-api
    env: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: TERRA_MODE
        value: replay
      - key: TERRA_CORS_ORIGINS
        value: 'https://agnitia-terra06.vercel.app' # Replace with actual Vercel URL
      - key: TERRA_DB_URL
        value: sqlite:////app/artifacts/terra.db
