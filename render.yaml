services:
  - type: web
    name: terra-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: TERRA_MODE
        value: replay
      - key: TERRA_SCHEDULER_ENABLED
        value: "false"
      - key: TERRA_CORS_ORIGINS
        sync: false
      - key: TERRA_DB_URL
        sync: false
    dockerBuildArgs:
      - key: ARTIFACT_URL
        sync: false
      - key: ARTIFACT_SHA256
        sync: false
