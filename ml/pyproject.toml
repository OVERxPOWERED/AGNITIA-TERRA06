[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terra"
version = "0.1.0"
description = "TERRA hybrid solar + wind forecasting engine"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "pvlib>=0.11",
  "windpowerlib>=0.2.2",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "tenacity>=8.2",
  "joblib>=1.3",
  "typer>=0.12",
  "matplotlib>=3.8",
  "tabulate>=0.9",
]

[project.optional-dependencies]
fm = ["chronos-forecasting>=2.0", "torch>=2.2", "peft>=0.10"]   # Chronos-2 (Kaggle GPU / optional locally)
tune = ["optuna>=3.6"]
real = ["kaggle>=1.6", "pdfplumber>=0.11", "openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
terra = "terra.pipelines.cli:app"

[tool.setuptools.packages.find]
include = ["terra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network or large data (skipped by default)"]
addopts = "-m 'not slow'"
