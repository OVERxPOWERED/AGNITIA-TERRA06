name: Prefetch weather

# Every 30 minutes: fetch live weather for each allowlisted site from GitHub's network and publish it to the
# `weather-data` branch (one commit, force-pushed, so history never grows). The deployed API reads
# https://raw.githubusercontent.com/<repo>/weather-data/<key>.json instead of calling Open-Meteo itself.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prefetch-weather
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e ml
      - run: python scripts/prefetch_weather.py out
      - name: Publish to the weather-data branch
        run: |
          cd out
          git init -q -b weather-data
          git config user.name "weather-prefetch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "weather $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" weather-data
